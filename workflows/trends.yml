name: Refresh trends and publish website
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 8,13,19 * * *'
      timezone: 'Europe/London'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: mainespark-site
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch RSS headlines
        run: python scripts/fetch_trends.py
      - name: Commit refreshed topics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/topics.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh trend headlines'
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
